name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add cache busting
        run: |
          # 添加 .nojekyll 文件禁用 Jekyll
          touch dist/.nojekyll
          
          # 生成构建时间戳和版本号
          BUILD_TIMESTAMP=$(date +%s)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          # 为所有 HTML 文件添加时间戳和版本号，强制浏览器识别为新文件
          find dist -name "*.html" -type f -exec sed -i "s|</head>|<!-- Build: $BUILD_TIMESTAMP | Commit: $COMMIT_SHA | Date: $BUILD_DATE --></head>|g" {} \;
          
          # 在 HTML 中添加 meta 标签强制刷新（增强缓存破坏）
          find dist -name "*.html" -type f -exec sed -i "s|<head>|<head><meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\"><meta http-equiv=\"Pragma\" content=\"no-cache\"><meta http-equiv=\"Expires\" content=\"0\">|g" {} \;
          
          # 输出构建信息
          echo "Build timestamp: $BUILD_TIMESTAMP"
          echo "Build date: $BUILD_DATE"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Files in dist/assets:"
          ls -lh dist/assets/ || echo "No assets directory"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

