name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add cache busting
        run: |
          set -e
          set -x
          
          echo "=========================================="
          echo "🚀 缓存破坏步骤开始"
          echo "=========================================="
          
          # 添加 .nojekyll 文件禁用 Jekyll
          touch dist/.nojekyll
          echo "✅ .nojekyll 已创建"
          
          # 生成构建时间戳和版本号
          BUILD_TIMESTAMP=$(date +%s)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          echo "📋 构建信息:"
          echo "   时间戳: $BUILD_TIMESTAMP"
          echo "   日期: $BUILD_DATE"
          echo "   提交: $COMMIT_SHA"
          echo ""
          
          # 显示构建产物（关键：验证文件名是否变化）
          echo "📁 构建产物列表:"
          ls -lh dist/assets/ | head -20
          echo ""
          
          # 添加时间戳注释到 HTML
          find dist -name "*.html" -type f -exec sed -i "s|</head>|<!-- Build: $BUILD_TIMESTAMP | Commit: $COMMIT_SHA | Date: $BUILD_DATE --></head>|g" {} \;
          
          # 添加强制刷新 meta 标签
          find dist -name "*.html" -type f -exec sed -i "s|<head>|<head><meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\"><meta http-equiv=\"Pragma\" content=\"no-cache\"><meta http-equiv=\"Expires\" content=\"0\">|g" {} \;
          
          echo "✅ Meta 标签已添加"
          echo ""
          
          # 二次保险：Node.js 脚本添加版本号参数
          echo "🔧 执行 Node.js 版本号脚本..."
          if [ -f "scripts/add-version-params.js" ]; then
            node scripts/add-version-params.js
            if [ $? -eq 0 ]; then
              echo "✅ 版本号参数添加成功"
            else
              echo "⚠️ 脚本执行失败（非致命，Vite 插件已处理）"
            fi
          else
            echo "⚠️ 脚本不存在（非致命，Vite 插件已处理）"
          fi
          echo ""
          
          # 【关键验证】显示 HTML 中实际的资源引用
          echo "=========================================="
          echo "🔍 验证：HTML 中的资源引用"
          echo "=========================================="
          find dist -name "*.html" -type f -exec grep -E "(src=|href=).*assets.*\.(js|css)" {} \; | head -10
          echo ""
          echo "=========================================="
          echo "✅ 缓存破坏步骤完成"
          echo "=========================================="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 必须：仅部署 dist，确保 Pages 使用构建产物而非源码
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

